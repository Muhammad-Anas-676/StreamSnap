name: Build StreamSnap + Admin APKs

on:
  push:
    branches: [ main, master, Main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare the fixed signing key (used when you have no secrets of your own)
        run: |
          for M in app admin; do
            if [ -f "$M/debug-keystore.b64" ]; then
              base64 -d "$M/debug-keystore.b64" > "$M/debug-fixed.keystore"
            fi
          done

      - name: Add the Firebase config files (from GitHub Secrets)
        env:
          GS_APP: ${{ secrets.GOOGLE_SERVICES_APP_B64 }}
          GS_ADMIN: ${{ secrets.GOOGLE_SERVICES_ADMIN_B64 }}
        run: |
          if [ -n "$GS_APP" ]; then printf '%s' "$GS_APP" | base64 -d > app/google-services.json; else echo "No GOOGLE_SERVICES_APP_B64 secret: user app is built without Firebase"; fi
          if [ -n "$GS_ADMIN" ]; then printf '%s' "$GS_ADMIN" | base64 -d > admin/google-services.json; else echo "No GOOGLE_SERVICES_ADMIN_B64 secret: admin app is built without Firebase"; fi

      - name: Build debug + release APKs for both apps
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > app/release.jks
            cp app/release.jks admin/release.jks
          fi
          gradle :app:assembleDebug :app:assembleRelease :admin:assembleDebug :admin:assembleRelease --stacktrace

      - name: Collect the 4 APKs with clear names
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk   dist/StreamSnap-user-release.apk
          cp app/build/outputs/apk/debug/*.apk     dist/StreamSnap-user-debug.apk
          cp admin/build/outputs/apk/release/*.apk dist/StreamSnap-admin-release.apk
          cp admin/build/outputs/apk/debug/*.apk   dist/StreamSnap-admin-debug.apk
          ls -l dist

      - name: Print the signing fingerprint to register in Firebase (public info)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -f app/release.jks ]; then
            keytool -list -v -keystore app/release.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1|SHA256" || true
          elif [ -f app/debug-fixed.keystore ]; then
            keytool -list -v -keystore app/debug-fixed.keystore -alias androiddebugkey -storepass android | grep -E "SHA1|SHA256" || true
          fi

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: StreamSnap-APKs
          path: dist/*.apk
          if-no-files-found: error
