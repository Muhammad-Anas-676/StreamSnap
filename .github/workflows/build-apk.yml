name: Build StreamSnap APK

on:
  push:
    branches: [ main, master, Main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare the fixed signing key (used when you have no secrets)
        run: |
          if [ -f app/debug-keystore.b64 ]; then
            base64 -d app/debug-keystore.b64 > app/debug-fixed.keystore
          fi

      - name: Build APK (your key if secrets exist, else the fixed key)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > app/release.jks
          fi
          gradle assembleRelease --stacktrace

      - name: Print signing fingerprints (public info)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -f app/release.jks ]; then
            keytool -list -v -keystore app/release.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1|SHA256" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamSnap-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
